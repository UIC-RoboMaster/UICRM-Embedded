# RTT 控制块搜索范围，默认覆盖 F4(128K/192K) 与 H7(128K DTCM)。
# 板级 cfg 可在 source 本文件之前覆盖，例如 F103_Nano(20K SRAM)：
#     set RTT_ADDR 0x20000000
#     set RTT_SIZE 0x5000
if {![info exists RTT_ADDR]} {
    set RTT_ADDR 0x20000000
}
if {![info exists RTT_SIZE]} {
    set RTT_SIZE 0x20000
}

proc start_rtt { } {
    # 通常是 openocd 已启动后再 source 本文件，重复 init 会报错，忽略即可
    catch {init}

    rtt setup $::RTT_ADDR $::RTT_SIZE "SEGGER RTT"
    rtt start
    rtt server start 8888 0
    rtt polling_interval 10
}

proc stop_rtt { } {
    rtt stop
}

# F1/F4 的 target 脚本会定义 _TARGETNAME；stm32h7x.cfg 只创建 $_CHIPNAME.cpu0
if {[info exists _TARGETNAME]} {
    set _RTT_TARGET $_TARGETNAME
} else {
    set _RTT_TARGET $_CHIPNAME.cpu0
}
targets $_RTT_TARGET

$_RTT_TARGET configure -event examine-start stop_rtt
$_RTT_TARGET configure -event examine-end start_rtt


start_rtt
